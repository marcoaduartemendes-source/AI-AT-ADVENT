name: Publish Dashboard to Pages

# Fix-via-GitHub: builds the dashboard and serves it at a permanent
# https://<owner>.github.io/<repo>/ link with NO droplet, SSH, DO
# console, or firewall involved. Runs on every docs/code change, every
# 30 min, and on manual dispatch.
on:
  workflow_dispatch:
  push:
    branches: [claude/daily-ai-news-digest-vcaC1]
    paths:
      - "docs/**"
      - "src/build_dashboard.py"
      - ".github/workflows/pages.yml"
  schedule:
    - cron: "*/30 * * * *"

# Pages deploy needs these. contents:read to checkout, pages:write +
# id-token:write for the deploy-pages action.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout deploy branch
        uses: actions/checkout@v4
        with:
          ref: claude/daily-ai-news-digest-vcaC1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Rebuild dashboard (best-effort; live broker positions)
        # || true so a CI build hiccup never blocks publishing — the
        # committed docs/index.html is the fallback.
        env:
          COINBASE_API_KEY:    ${{ secrets.COINBASE_API_KEY }}
          COINBASE_API_SECRET: ${{ secrets.COINBASE_API_SECRET }}
          ALPACA_API_KEY_ID:   ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_SECRET_KEY:   ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_ENDPOINT:     ${{ secrets.ALPACA_ENDPOINT }}
          KALSHI_KEY_ID:       ${{ secrets.KALSHI_KEY_ID }}
          KALSHI_PRIVATE_KEY:  ${{ secrets.KALSHI_PRIVATE_KEY }}
          KALSHI_ENDPOINT:     ${{ secrets.KALSHI_ENDPOINT }}
          DRY_RUN:             ${{ vars.ORCHESTRATOR_DRY_RUN || 'true' }}
          DRY_RUN_COINBASE:    ${{ vars.DRY_RUN_COINBASE || 'true' }}
          DRY_RUN_ALPACA:      ${{ vars.DRY_RUN_ALPACA || 'false' }}
          DRY_RUN_KALSHI:      ${{ vars.DRY_RUN_KALSHI || 'false' }}
          LIVE_STRATEGIES:     ${{ vars.LIVE_STRATEGIES }}
          ALLOW_LIVE_TRADING:  ${{ vars.ALLOW_LIVE_TRADING }}
        run: python src/build_dashboard.py || echo "build failed; publishing committed docs/"

      - name: Configure Pages (self-enable)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload docs/ as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
